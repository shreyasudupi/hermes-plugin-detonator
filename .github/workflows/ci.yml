name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: Unit + Docker sandbox tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements-dev.txt
      - name: Run tests (Docker is preinstalled on GitHub runners)
        run: python -m pytest -q -rs

  windows:
    name: Windows host checks (no Linux sandbox on GitHub's Windows machines)
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements-dev.txt
      - name: Run tests (the Docker sandbox tests skip, because only Windows containers run here)
        run: python -m pytest -q -rs
      - name: Windows smoke test (real git fetch, Docker message, docker run paths)
        run: python ci/windows_smoke.py

  hermes-validate:
    name: Real Hermes catalog check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - name: Install Hermes Agent (official installer)
        run: |
          curl -fsSL https://hermes-agent.nousresearch.com/install.sh \
            | bash -s -- --non-interactive --skip-browser --skip-computer-use
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: hermes --version
      - name: hermes plugins validate (same check the catalog CI runs)
        run: hermes plugins validate .

  fixtures:
    name: Fake-malicious fixtures get their expected verdict
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Read-only token for the private fixtures repo. GitHub never gives secrets to
      # pull requests from forks, so only those may skip; everywhere else a missing
      # token fails the job, so a green tick always means the fixtures ran.
      FIXTURES_TOKEN: ${{ secrets.FIXTURES_TOKEN }}
      FROM_FORK: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - name: Skip on fork pull requests (no secrets there)
        if: env.FIXTURES_TOKEN == '' && env.FROM_FORK == 'true'
        run: echo "::warning::Pull request from a fork has no FIXTURES_TOKEN, so the fixtures were NOT checked. A maintainer must run them before merging."
      - name: Fail when the fixtures token is missing
        if: env.FIXTURES_TOKEN == '' && env.FROM_FORK != 'true'
        run: |
          echo "::error::FIXTURES_TOKEN is not set, so the fixtures could not run. Add the secret (Settings > Secrets and variables > Actions)."
          exit 1
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        if: env.FIXTURES_TOKEN != ''
        with:
          repository: shreyasudupi/detonator-test-fixtures
          token: ${{ secrets.FIXTURES_TOKEN }}
          path: fixtures
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        if: env.FIXTURES_TOKEN != ''
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements-dev.txt
        if: env.FIXTURES_TOKEN != ''
      - name: Check out the trojan's clean first version
        if: env.FIXTURES_TOKEN != ''
        run: git -C fixtures worktree add -q ../fixtures-v1 cc4d572136cb8b8fad0787023dd78c91ce852823
      - name: Run every fixture inside the Docker sandbox
        if: env.FIXTURES_TOKEN != ''
        run: python ci/check_fixtures.py fixtures fixtures-v1
