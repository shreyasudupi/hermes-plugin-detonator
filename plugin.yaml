name: detonator
version: "0.3.0"
description: >
  Security testing sandbox for Hermes plugins. After you approve it, runs a plugin
  you did not write at an exact commit inside a disposable Docker container with
  decoy secrets and a fake internet, watched from inside and by an outside tracer,
  then reports what it actually did (key theft, network attempts, shell commands,
  persistence, tool poisoning) versus what it declares. Advisory only. Requires Docker; runs git and docker commands (see README).
author: shreyasudupi
license: MIT
requires_hermes: ">=0.23.0"
provides_tools:
  - detonate_plugin
  - detonator_report
provides_hooks: []
homepage: https://github.com/shreyasudupi/hermes-plugin-detonator
tags: [security, security-testing, sandbox, malware, supply-chain, docker]
