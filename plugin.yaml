name: detonator
version: "0.2.0"
description: >
  Dynamic sandbox for Hermes plugins. After you approve it, runs a plugin at an
  exact commit inside a disposable, no-network Docker container with decoy
  secrets, then reports what it actually did versus what it declares.
  Advisory only. Requires Docker; runs git and docker commands (see README).
author: shreyasudupi
license: MIT
requires_hermes: ">=0.23.0"
provides_tools:
  - detonate_plugin
provides_hooks: []
homepage: https://github.com/shreyasudupi/hermes-plugin-detonator
tags: [security, sandbox, docker]
